services:
  web:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn iot_monitoring.wsgi:application --bind 0.0.0.0:8000"
    env_file:
      - .env
    environment:
      DATABASE_NAME: /app/data/db.sqlite3
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - sqlite_data:/app/data
      - static_data:/app/staticfiles
      - media_data:/app/media
    depends_on:
      - redis

  celery:
    build: .
    command: celery -A iot_monitoring worker --loglevel=info
    env_file:
      - .env
    environment:
      DATABASE_NAME: /app/data/db.sqlite3
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - sqlite_data:/app/data
    depends_on:
      - redis

  redis:
    image: redis:7-alpine

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/staticfiles:ro
      - media_data:/media:ro
    depends_on:
      - web

volumes:
  sqlite_data:
  static_data:
  media_data:
